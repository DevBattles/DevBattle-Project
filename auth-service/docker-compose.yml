# ===========================================
# DevBattle Auth Service - Docker Compose
# ===========================================

version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devbattle-auth-service
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@auth-db:5432/devbattle_auth
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - devbattle-network
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - auth-logs:/app/logs

  auth-db:
    image: postgres:16-alpine
    container_name: devbattle-auth-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=devbattle_auth
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - devbattle-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  devbattle-network:
    driver: bridge

volumes:
  auth-db-data:
    driver: local
  auth-logs:
    driver: local
